name: Filter Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  filtros:
    name: "Filtros de calidad"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run filter regression tests
        run: python tests/test_filtros.py
