<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Mis enlaces · Flipazo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #F52834; --brand-soft: rgba(245,40,52,.08);
      --bg: #FEFEF8; --card: #FFFFFF; --border: #E5E7EB; --surface: #F3F4F6;
      --ink: #111827; --mid: #6B7280; --dim: #9CA3AF; --blue: #0581FC;
      --serif: 'Playfair Display', Georgia, serif; --sans: 'Nunito', system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111827; --card:#1F2937; --border:#374151; --surface:#111827;
              --ink:#F9FAFB; --mid:#9CA3AF; --dim:#6B7280; --blue:#4FA8FF; --brand-soft: rgba(245,40,52,.14); }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 32px 18px 64px; }
    .head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    h1 { font-family: var(--serif); font-weight: 900; font-size: clamp(26px, 5vw, 38px); margin: 0; letter-spacing: -.01em; }
    .sub { color: var(--mid); font-size: 14px; margin: 6px 0 0; }
    .refresh { font-family: var(--sans); font-size: 13px; font-weight: 700; color: var(--brand); background: var(--brand-soft); border: none; border-radius: 9999px; padding: 8px 16px; cursor: pointer; }
    .refresh:active { transform: translateY(1px); }
    .total-strip { display: flex; gap: 10px; flex-wrap: wrap; margin: 22px 0 6px; }
    .total-pill { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 18px; }
    .total-pill b { display: block; font-family: var(--serif); font-weight: 900; font-size: 26px; color: var(--brand); line-height: 1; }
    .total-pill span { font-size: 12px; color: var(--mid); font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 18px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px; }
    .card__top { display: flex; align-items: center; gap: 10px; }
    .card__ico { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; background: var(--surface); }
    .card__name { font-weight: 800; font-size: 15px; text-transform: capitalize; }
    .card__num { font-family: var(--serif); font-weight: 900; font-size: 46px; line-height: 1; margin: 14px 0 2px; letter-spacing: -.02em; }
    .card__sub { font-size: 13px; color: var(--mid); font-weight: 600; }
    .card__link { display: flex; align-items: center; gap: 8px; margin-top: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
    .card__link code { font-family: var(--sans); font-size: 12px; font-weight: 700; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .card__copy { font-size: 11px; font-weight: 800; color: var(--brand); background: none; border: none; cursor: pointer; white-space: nowrap; }
    .bars { display: flex; align-items: flex-end; gap: 3px; height: 46px; margin-top: 16px; }
    .bars__bar { flex: 1; background: var(--brand); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
    .bars__bar--empty { background: var(--border); opacity: .5; }
    .bars__lbl { font-size: 11px; color: var(--dim); margin-top: 6px; display: flex; justify-content: space-between; }
    .empty { color: var(--dim); font-size: 13px; margin-top: 14px; }
    .foot { color: var(--dim); font-size: 12px; margin-top: 30px; text-align: center; }
    .foot a { color: var(--mid); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <h1>Mis enlaces</h1>
        <p class="sub">Clics de tus enlaces de bio (contados en el servidor, 100% reales).</p>
      </div>
      <button class="refresh" onclick="cargar()">↻ Actualizar</button>
    </div>

    <div class="total-strip" id="totales"></div>
    <div class="grid" id="grid"></div>

    <p class="foot">Actualizado <span id="ts">—</span> · datos de <a href="https://api.flipazo.es/go-stats/threads" target="_blank" rel="noopener">la API de Flipazo</a></p>
  </div>

  <script>
    const API = "https://api.flipazo.es";
    const CANALES = [
      { slug: "threads",   emoji: "🧵" },
      { slug: "instagram", emoji: "📸" },
      { slug: "tiktok",    emoji: "🎵" },
      { slug: "youtube",   emoji: "▶️" },
    ];

    function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

    function barras(porDia){
      // Últimos 14 días (rellena huecos con 0)
      const dias = [];
      const hoy = new Date();
      for (let i = 13; i >= 0; i--){
        const d = new Date(hoy); d.setDate(hoy.getDate() - i);
        const k = d.toISOString().slice(0,10);
        dias.push([k, porDia[k] || 0]);
      }
      const max = Math.max(1, ...dias.map(d => d[1]));
      const bars = dias.map(([k,n]) =>
        `<div class="bars__bar${n?'':' bars__bar--empty'}" style="height:${Math.round((n/max)*100)}%" title="${k}: ${n}"></div>`
      ).join("");
      const primer = dias[0][0].slice(5).replace("-","/");
      const ult = dias[13][0].slice(5).replace("-","/");
      return `<div class="bars">${bars}</div><div class="bars__lbl"><span>${primer}</span><span>hoy</span></div>`;
    }

    function cardHtml(c, data){
      const total = (data && data.clicks_total) || 0;
      const unicos = (data && data.clicks_unicos_ip) || 0;
      const link = `www.flipazo.es/go/${c.slug}`;
      const cuerpo = total > 0
        ? `<div class="card__num">${total.toLocaleString("es-ES")}</div>
           <div class="card__sub">${unicos.toLocaleString("es-ES")} personas · ${total} clics</div>
           ${barras((data && data.por_dia) || {})}`
        : `<div class="card__num" style="color:var(--dim)">0</div>
           <div class="empty">Aún sin clics. Comparte el enlace 👇</div>`;
      return `<div class="card">
        <div class="card__top"><div class="card__ico">${c.emoji}</div><div class="card__name">${c.slug}</div></div>
        ${cuerpo}
        <div class="card__link"><code>${esc(link)}</code>
          <button class="card__copy" onclick="copiar('https://${esc(link)}', this)">Copiar</button></div>
      </div>`;
    }

    function copiar(url, btn){
      const done = () => { const t = btn.textContent; btn.textContent = "¡Copiado!"; setTimeout(()=>btn.textContent=t, 1400); };
      (navigator.clipboard?.writeText(url).then(done).catch(()=>done())) || done();
    }

    async function cargar(){
      const grid = document.getElementById("grid");
      const tot = document.getElementById("totales");
      grid.innerHTML = CANALES.map(c => `<div class="card"><div class="card__top"><div class="card__ico">${c.emoji}</div><div class="card__name">${c.slug}</div></div><div class="empty">Cargando…</div></div>`).join("");
      const results = await Promise.all(CANALES.map(async c => {
        try { const r = await fetch(`${API}/go-stats/${c.slug}`, {cache:"no-store"}); return r.ok ? await r.json() : null; }
        catch { return null; }
      }));
      grid.innerHTML = CANALES.map((c,i) => cardHtml(c, results[i])).join("");
      const totalClicks = results.reduce((s,d)=> s + ((d&&d.clicks_total)||0), 0);
      const totalUnicos = results.reduce((s,d)=> s + ((d&&d.clicks_unicos_ip)||0), 0);
      tot.innerHTML =
        `<div class="total-pill"><b>${totalClicks.toLocaleString("es-ES")}</b><span>clics totales</span></div>
         <div class="total-pill"><b>${totalUnicos.toLocaleString("es-ES")}</b><span>personas (aprox.)</span></div>`;
      document.getElementById("ts").textContent = new Date().toLocaleString("es-ES");
    }
    cargar();
  </script>
</body>
</html>
