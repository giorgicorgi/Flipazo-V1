<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Mis enlaces · Flipazo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #F52834; --brand-soft: rgba(245,40,52,.08);
      --bg: #FEFEF8; --card: #FFFFFF; --border: #E5E7EB; --surface: #F3F4F6;
      --ink: #111827; --mid: #6B7280; --dim: #9CA3AF; --blue: #0581FC; --teal: #14C1AE;
      --serif: 'Playfair Display', Georgia, serif; --sans: 'Nunito', system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111827; --card:#1F2937; --border:#374151; --surface:#111827;
              --ink:#F9FAFB; --mid:#9CA3AF; --dim:#6B7280; --blue:#4FA8FF; --brand-soft: rgba(245,40,52,.16); }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 30px 16px 70px; }
    .head { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; }
    h1 { font-family:var(--serif); font-weight:900; font-size:clamp(26px,5vw,38px); margin:0; letter-spacing:-.01em; }
    .sub { color:var(--mid); font-size:14px; margin:6px 0 0; }
    .refresh { font-family:var(--sans); font-size:13px; font-weight:700; color:var(--brand); background:var(--brand-soft); border:none; border-radius:9999px; padding:8px 16px; cursor:pointer; }
    .refresh:active { transform:translateY(1px); }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:22px 0 4px; }
    .tab { display:inline-flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:9999px; padding:9px 16px; font-weight:700; font-size:14px; color:var(--ink); cursor:pointer; text-transform:capitalize; transition:all .12s; }
    .tab b { color:var(--brand); }
    .tab--active { background:var(--brand); border-color:var(--brand); color:#fff; }
    .tab--active b { color:#fff; }
    .section { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:22px; margin-top:16px; }
    .section h2 { font-family:var(--sans); font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--mid); margin:0 0 16px; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; }
    .kpi b { display:block; font-family:var(--serif); font-weight:900; font-size:40px; line-height:1; letter-spacing:-.02em; }
    .kpi b.brand { color:var(--brand); } .kpi b.blue { color:var(--blue); } .kpi b.teal { color:#0D7A6F; }
    .kpi span { font-size:12.5px; color:var(--mid); font-weight:600; display:block; margin-top:6px; }
    .kpi small { color:var(--dim); font-size:11px; }
    .cols { display:grid; grid-template-columns:1fr 1fr; gap:26px; }
    @media (max-width:560px){ .cols { grid-template-columns:1fr; gap:20px; } }
    .rowlist { display:flex; flex-direction:column; gap:9px; }
    .rowlist__it { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; font-size:13.5px; }
    .rowlist__bar { grid-column:1/-1; height:6px; background:var(--surface); border-radius:4px; overflow:hidden; }
    .rowlist__bar i { display:block; height:100%; background:var(--brand); border-radius:4px; }
    .rowlist__name { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .rowlist__n { color:var(--mid); font-weight:700; }
    .flag { font-size:15px; margin-right:5px; }
    /* Heatmap */
    .heat-scroll { overflow-x:auto; }
    .heat { border-collapse:collapse; font-size:10px; color:var(--dim); }
    .heat td, .heat th { padding:0; text-align:center; }
    .heat th { font-weight:700; padding:0 2px 4px; }
    .heat .daylbl { padding-right:8px; font-weight:700; color:var(--mid); text-align:right; white-space:nowrap; }
    .heat__cell { width:16px; height:16px; border-radius:3px; background:var(--surface); }
    .bars { display:flex; align-items:flex-end; gap:3px; height:70px; margin-top:6px; }
    .bars__b { flex:1; background:var(--brand); border-radius:3px 3px 0 0; min-height:2px; opacity:.85; }
    .bars__b--e { background:var(--border); opacity:.5; }
    .bars__lbl { display:flex; justify-content:space-between; font-size:10px; color:var(--dim); margin-top:5px; }
    .link { display:flex; align-items:center; gap:8px; margin-top:16px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 12px; max-width:420px; }
    .link code { font-family:var(--sans); font-size:12.5px; font-weight:700; color:var(--ink); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .link button { font-size:11px; font-weight:800; color:var(--brand); background:none; border:none; cursor:pointer; white-space:nowrap; }
    .note { color:var(--dim); font-size:12px; margin-top:10px; line-height:1.5; }
    .empty { color:var(--dim); font-size:13px; }
    .foot { color:var(--dim); font-size:12px; margin-top:28px; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <h1>Mis enlaces</h1>
        <p class="sub">Analítica de tus enlaces de bio · clics contados en el servidor (100% reales)</p>
      </div>
      <button class="refresh" onclick="cargarTodo()">↻ Actualizar</button>
    </div>

    <div class="tabs" id="tabs"></div>
    <div id="detalle"></div>
    <div id="audiencia-threads"></div>

    <p class="foot" id="foot">Cargando…</p>
  </div>

  <script>
    const API = "https://api.flipazo.es";
    const CANALES = [
      { slug:"threads", emoji:"🧵" }, { slug:"instagram", emoji:"📸" },
      { slug:"tiktok", emoji:"🎵" }, { slug:"youtube", emoji:"▶️" },
    ];
    const DOW = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
    let _stats = {}, _activo = "threads";

    function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
    function flag(cc){ if(!cc||cc.length!==2) return "🏳️"; return String.fromCodePoint(...[...cc.toUpperCase()].map(c=>127397+c.charCodeAt(0))); }
    function copiar(url,btn){ const t=btn.textContent; const d=()=>{btn.textContent="¡Copiado!";setTimeout(()=>btn.textContent=t,1400);}; (navigator.clipboard?.writeText(url).then(d).catch(d))||d(); }

    function rowlist(items, nameKey){
      if(!items.length) return `<p class="empty">Sin datos todavía.</p>`;
      const max = Math.max(1, ...items.map(i=>i.clicks));
      return `<div class="rowlist">` + items.map(i=>`
        <div class="rowlist__it">
          <span class="rowlist__name">${i.code?`<span class="flag">${flag(i.code)}</span>`:""}${esc(i[nameKey])}</span>
          <span class="rowlist__n">${i.clicks}</span>
          <span class="rowlist__bar"><i style="width:${Math.round(i.clicks/max*100)}%"></i></span>
        </div>`).join("") + `</div>`;
    }

    function heatmap(matrix){
      const max = Math.max(1, ...matrix.flat());
      let head = "<tr><th></th>";
      for(let h=0;h<24;h++) head += `<th>${h%3===0?h:""}</th>`;
      head += "</tr>";
      let body = "";
      for(let d=0;d<7;d++){
        body += `<tr><td class="daylbl">${DOW[d]}</td>`;
        for(let h=0;h<24;h++){
          const n = matrix[d][h];
          const op = n? (0.15 + 0.85*n/max) : 0;
          const bg = n? `background:rgba(245,40,52,${op.toFixed(2)})` : "";
          body += `<td><div class="heat__cell" style="${bg}" title="${DOW[d]} ${h}:00 · ${n} clic${n!==1?"s":""}"></div></td>`;
        }
        body += "</tr>";
      }
      return `<div class="heat-scroll"><table class="heat">${head}${body}</table></div>
        <p class="note">Hora de España. Cuanto más rojo, más clics en esa franja.</p>`;
    }

    function bars(arr, labels){
      const max = Math.max(1, ...arr);
      const b = arr.map(n=>`<div class="bars__b${n?"":" bars__b--e"}" style="height:${Math.round(n/max*100)}%" title="${n}"></div>`).join("");
      return `<div class="bars">${b}</div><div class="bars__lbl">${labels.map(l=>`<span>${l}</span>`).join("")}</div>`;
    }

    async function renderDetalle(slug){
      _activo = slug;
      document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("tab--active", t.dataset.slug===slug));
      const el = document.getElementById("detalle");
      el.innerHTML = `<div class="section"><p class="empty">Cargando ${slug}…</p></div>`;
      let d; try { d = await (await fetch(`${API}/go-detail/${slug}`,{cache:"no-store"})).json(); } catch { d=null; }
      if(!d){ el.innerHTML = `<div class="section"><p class="empty">No se pudo cargar.</p></div>`; return; }
      const link = `www.flipazo.es/${slug}`;
      const c = d.conversion||{};
      const totalGeo = (d.geo.paises||[]).reduce((s,p)=>s+p.clicks,0);
      el.innerHTML = `
        <div class="section">
          <h2>Resumen · ${slug}</h2>
          <div class="kpis">
            <div class="kpi"><b class="brand">${(d.clicks_total||0).toLocaleString("es-ES")}</b><span>clics totales</span></div>
            <div class="kpi"><b>${(d.clicks_unicos_ip||0).toLocaleString("es-ES")}</b><span>IPs únicas</span></div>
            <div class="kpi"><b class="teal">${c.tasa||0}%</b><span>conversión<br><small>${c.con_clic_deal||0} de ${c.visitantes||0} clicaron un deal</small></span></div>
          </div>
          <div class="link"><code>${esc(link)}</code><button onclick="copiar('https://${esc(link)}',this)">Copiar</button></div>
        </div>
        <div class="section">
          <h2>📍 Ubicaciones ${d.geo.sin_geo?`· <span style="text-transform:none;color:var(--dim)">${d.geo.sin_geo} sin geo (bots/privadas)</span>`:""}</h2>
          <div class="cols">
            <div><div class="note" style="margin:0 0 10px;font-weight:800;color:var(--mid)">Países</div>${rowlist(d.geo.paises||[],"pais")}</div>
            <div><div class="note" style="margin:0 0 10px;font-weight:800;color:var(--mid)">Ciudades</div>${rowlist(d.geo.ciudades||[],"ciudad")}</div>
          </div>
          ${totalGeo? `<p class="note">💡 Mucho tráfico de EE.UU. suele ser el <b>bot de previsualización de Meta/Threads</b>, no personas. Fíjate en las ciudades de España para el tráfico humano real.</p>`:""}
        </div>
        <div class="section">
          <h2>🗓️ Heatmap · cuándo entran (día × hora)</h2>
          ${heatmap(d.heatmap)}
        </div>
        <div class="section">
          <div class="cols">
            <div><h2>Por hora del día</h2>${bars(d.por_hora,["0h","6h","12h","18h","23h"])}</div>
            <div><h2>Por día de la semana</h2>${bars(d.por_dow,DOW)}</div>
          </div>
        </div>`;
      const audBox = document.getElementById("audiencia-threads");
      if (audBox) {
        if (slug === "threads") { await renderAudienciaThreads(); }
        else { audBox.innerHTML = ""; }
      }
    }

    const GENERO_LBL = { F:"Mujeres", M:"Hombres", U:"Sin especificar" };
    function nombrePais(cc){
      try { return new Intl.DisplayNames(["es"],{type:"region"}).of(cc) || cc; } catch { return cc; }
    }
    function toRows(arr, nameKey, mapper, withFlagCode){
      return (arr||[]).map(x=>{
        const row = { [nameKey]: mapper ? mapper(x.value) : x.value, clicks: x.count };
        if (withFlagCode) row.code = x.value;
        return row;
      });
    }

    async function renderAudienciaThreads(){
      const box = document.getElementById("audiencia-threads");
      if (!box) return;
      box.innerHTML = `<div class="section"><p class="empty">Cargando audiencia…</p></div>`;
      let d; try { d = await (await fetch(`${API}/threads-audience`,{cache:"no-store"})).json(); } catch { d=null; }
      if (!d || d.error){ box.innerHTML = `<div class="section"><h2>👥 Audiencia de Threads</h2><p class="empty">No se pudo cargar.</p></div>`; return; }
      box.innerHTML = `
        <div class="section">
          <h2>👥 Audiencia de Threads · seguidores</h2>
          <div class="kpis">
            <div class="kpi"><b class="brand">${(d.followers_count||0).toLocaleString("es-ES")}</b><span>seguidores totales</span></div>
          </div>
          <div class="cols" style="margin-top:18px">
            <div><div class="note" style="margin:0 0 10px;font-weight:800;color:var(--mid)">Países</div>${rowlist(toRows(d.country,"pais",nombrePais,true),"pais")}</div>
            <div><div class="note" style="margin:0 0 10px;font-weight:800;color:var(--mid)">Ciudades</div>${rowlist(toRows(d.city,"ciudad"),"ciudad")}</div>
          </div>
          <div class="cols" style="margin-top:20px">
            <div><div class="note" style="margin:0 0 10px;font-weight:800;color:var(--mid)">Edad</div>${rowlist(toRows(d.age,"rango"),"rango")}</div>
            <div><div class="note" style="margin:0 0 10px;font-weight:800;color:var(--mid)">Género</div>${rowlist(toRows(d.gender,"genero",g=>GENERO_LBL[g]||g),"genero")}</div>
          </div>
          <p class="note">Datos de seguidores de la cuenta (no de quién interactúa con cada post). Se actualiza como máximo cada hora.</p>
        </div>`;
    }

    function renderTabs(){
      document.getElementById("tabs").innerHTML = CANALES.map(c=>{
        const n = _stats[c.slug]?.clicks_total || 0;
        return `<button class="tab${c.slug===_activo?" tab--active":""}" data-slug="${c.slug}" onclick="renderDetalle('${c.slug}')">${c.emoji} ${c.slug} <b>${n}</b></button>`;
      }).join("");
    }

    async function cargarTodo(){
      const res = await Promise.all(CANALES.map(async c=>{
        try { return [c.slug, await (await fetch(`${API}/go-stats/${c.slug}`,{cache:"no-store"})).json()]; } catch { return [c.slug,null]; }
      }));
      _stats = Object.fromEntries(res);
      renderTabs();
      await renderDetalle(_activo);
      document.getElementById("foot").textContent = "Actualizado " + new Date().toLocaleString("es-ES");
    }
    cargarTodo();
  </script>
</body>
</html>
